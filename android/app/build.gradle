plugins {
    id 'com.android.application'
}

android {
    namespace 'network.xchat.app'
    compileSdk 34

    defaultConfig {
        applicationId "network.xchat.app"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "0.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero third-party dependencies required for core standalone webview mesh app
}
